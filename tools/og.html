<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Social image source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@600;800&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;display=swap&amp;text=The%20GovernancLab">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #1f3329; color: #f2f6f0; font-family: Mulish, sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(168,196,162,.10) 1px, transparent 1px), linear-gradient(to bottom, rgba(168,196,162,.10) 1px, transparent 1px); background-size: 48px 48px; -webkit-mask-image: radial-gradient(80% 90% at 85% 30%, #000, transparent 75%); }
  .mark { position: absolute; right: -20px; top: 96px; width: 470px; opacity: .95; }
  .wrap { position: absolute; left: 80px; top: 78px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 30px; }
  .brand img { width: 76px; }
  h1 { font-family: Newsreader, serif; font-weight: 400; font-size: 68px; line-height: 1.04; letter-spacing: -0.02em; margin: 70px 0 28px; }
  h1 em { color: #a8c4a2; }
  p { font-size: 25px; line-height: 1.45; color: #c3d2bf; margin: 0; max-width: 600px; }
  .foot { position: absolute; left: 80px; bottom: 56px; font-size: 19px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #a8c4a2; }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="mark" src="../assets/img/mark-light.svg" alt="">
  <div class="wrap">
    <div class="brand"><img src="../assets/img/mark-light.svg" alt="">The Governance Lab</div>
    <h1>Clearer governance.<br>Practical improvement.<br><em>Safer care.</em></h1>
  </div>
  <div class="foot">Clinical governance &middot; Quality &middot; Patient safety &middot; PoCT</div>
</body>
</html>
